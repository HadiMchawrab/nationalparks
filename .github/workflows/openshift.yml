name: OpenShift

env:
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  REGISTRY_USER: ${{ github.actor }}
  REGISTRY_PASSWORD: ${{ github.token }}
  APP_NAME: nationalparks
  IMAGE_TAGS: latest ${{ github.sha }}

  OPENSHIFT_SERVER: ${{ secrets.OPENSHIFT_SERVER }}
  OPENSHIFT_TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}
  OPENSHIFT_NAMESPACE: "%PROJECT%"

  APP_PORT: "8080"

on:
  push:
    branches: [ master ]

jobs:
  build-and-push:
    name: Build and push to GitHub Container Registry
    runs-on: ubuntu-24.04
    environment: development

    outputs:
      ROUTE: ${{ steps.deploy-and-expose.outputs.route }}
      SELECTOR: ${{ steps.deploy-and-expose.outputs.selector }}

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v2

      # Build the application image
      - name: S2I Build
        id: build_image
        uses: redhat-actions/s2i-build@v2
        with:
          path_context: '.'
          builder_image: 'registry.access.redhat.com/ubi8/openjdk-11'
          image: ${{ env.APP_NAME }}
          tags: ${{ env.IMAGE_TAGS }}

      # Push the image to GitHub Container Registry
      - name: Push to Registry
        id: push-to-registry
        uses: redhat-actions/push-to-registry@v3
        with:
          image: ${{ steps.build_image.outputs.image }}
          tags: ${{ steps.build_image.outputs.tags }}
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}

      # Log in to OpenShift
      - name: Log in to OpenShift
        uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: ${{ env.OPENSHIFT_SERVER }}
          openshift_token: ${{ env.OPENSHIFT_TOKEN }}
          insecure_skip_tls_verify: true
          namespace: ${{ env.OPENSHIFT_NAMESPACE }}

      # Deploy the newly pushed image
      - name: Deploy application
        run: |
          "${GITHUB_WORKSPACE}/.github/script.sh" \
            "${{ env.APP_NAME }}" \
            "${{ env.IMAGE_REGISTRY }}/${{ steps.build_image.outputs.image }}:${{ github.sha }}" \
            "${{ env.OPENSHIFT_NAMESPACE }}"
