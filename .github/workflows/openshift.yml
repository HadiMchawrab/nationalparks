name: OpenShift

env:
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  REGISTRY_USER: ${{ github.actor }}
  REGISTRY_PASSWORD: ${{ secrets.GHCR_TOKEN }}
  APP_NAME: nationalparks
  IMAGE_TAGS: latest ${{ github.sha }}

  OPENSHIFT_SERVER: ${{ secrets.OPENSHIFT_SERVER }}
  OPENSHIFT_TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}
  OPENSHIFT_NAMESPACE: "%PROJECT%"

  APP_PORT: "8080"

on:
  push:
    branches: [ master ]

jobs:
  build-and-push:
    name: Build and push Java image to GitHub Container Registry
    runs-on: ubuntu-24.04
    environment: development

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Build the Java application image with S2I
      - name: S2I Build
        id: build_image
        uses: redhat-actions/s2i-build@v2
        with:
          path_context: '.'
          builder_image: 'registry.access.redhat.com/ubi8/openjdk-11'
          image: ${{ env.APP_NAME }}
          tags: ${{ env.IMAGE_TAGS }}

      # Push the image to GHCR
      - name: Push to Registry
        id: push-to-registry
        uses: redhat-actions/push-to-registry@v3
        with:
          image: ${{ steps.build_image.outputs.image }}
          tags: ${{ steps.build_image.outputs.tags }}
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}

      # Install the OpenShift CLI
      - name: Install OpenShift CLI
        uses: redhat-actions/oc-installer@v1

      # Log in to the Developer Sandbox
      - name: Log in to OpenShift
        uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: ${{ env.OPENSHIFT_SERVER }}
          openshift_token: ${{ env.OPENSHIFT_TOKEN }}
          insecure_skip_tls_verify: true
          namespace: ${{ env.OPENSHIFT_NAMESPACE }}

      # Deploy the image identified by the commit SHA
      - name: Deploy application
        run: |
          bash "${GITHUB_WORKSPACE}/.github/script.sh" \
            "${{ env.APP_NAME }}" \
            "${{ env.IMAGE_REGISTRY }}/${{ env.APP_NAME }}:${{ github.sha }}" \
            "${{ env.OPENSHIFT_NAMESPACE }}"
